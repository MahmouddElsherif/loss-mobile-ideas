<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loss Notify Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Playfair+Display:wght@500&display=swap">
<style>
  /* Layout: a plain picking sheet. Each numbered figure shows the real navy product page, laptop beside phone. */
  :root {
    --bg: #f3f4f8; --card: #ffffff; --ink: #1c2a68; --muted: #5b6390; --line: #c9cfdf;
    --ui: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
    --body: Geist, system-ui, "Segoe UI", sans-serif;
    --head: "Playfair Display", Georgia, serif;
    /* Store colors stay fixed in both page themes */
    --navy: #0b0d47; --navy-2: #2e3180; --white: #ffffff; --sky: #4a9bf0; --sold: #7b7da6; --soft: rgb(255 255 255 / .66); --hair: rgb(255 255 255 / .22);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #11152b; --card: #1a1f3a; --ink: #eef0fa; --muted: #a9b0d6; --line: #2c3460; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #11152b; --card: #1a1f3a; --ink: #eef0fa; --muted: #a9b0d6; --line: #2c3460; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--ui); }
  .wrap { max-width: 1240px; margin: auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
  h1 { margin: 0 0 4px; font-size: 27px; line-height: 1.25; text-wrap: balance; }
  h2 { margin: 18px 0 0; font-size: 20px; }
  .lead { margin: 0; color: var(--muted); max-width: 62ch; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; display: flex; flex-direction: column; }
  figcaption { padding: 12px 2px 2px; }
  figcaption b { display: block; font-size: 16px; font-weight: 600; }
  figcaption span { color: var(--muted); font-size: 13.5px; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 10px; }
  @media (max-width: 760px) { .pair { grid-template-columns: minmax(0, 1fr); } .phone { max-width: 300px; justify-self: center; width: 100%; } }
  .grid-btn { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .grid-pop { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  @media (max-width: 980px) { .grid-pop { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .grid-pop { grid-template-columns: minmax(0, 1fr); } }

  /* The product page inside each mockup */
  .pdp, .phone, .pop { direction: ltr; text-align: left; font-family: var(--body); color: var(--white); background: var(--navy); border-radius: 6px; overflow: hidden; position: relative; }
  .pdp { display: grid; grid-template-columns: 38% minmax(0, 1fr); min-height: 430px; }
  .shot { background: var(--photo) center 22% / cover; }
  .panel { padding: 18px 52px 18px 28px; display: flex; flex-direction: column; gap: 9px; justify-content: center; min-width: 0; font-size: 12.5px; }
  .phone { display: flex; flex-direction: column; }
  .phone .shot { height: 128px; flex: none; background-position: center 30%; }
  .phone .panel { padding: 12px 32px 16px 14px; justify-content: flex-start; flex: 1; }
  .name { font: 500 16px/1.2 var(--head); }
  .price { font-size: 11.5px; } .price s { opacity: .65; }
  .lbl { font-weight: 500; }
  .sizes { display: flex; gap: 4px; }
  .sizes i { font-style: normal; flex: 1; text-align: center; padding: 5px 0; border-radius: 99px; }
  .sizes i.on { background: var(--white); color: var(--navy); }
  .swatches { display: flex; gap: 7px; align-items: center; }
  .swatches i { width: 19px; height: 19px; display: block; }
  .swatches i.on { outline: 2px solid var(--white); outline-offset: 1px; background-image: linear-gradient(to top right, transparent 47%, var(--navy) 47% 53%, transparent 53%) !important; }
  .ship { display: flex; gap: 7px; align-items: center; font-size: 11.5px; } .ship::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #2fb56a; flex: none; }
  .fine { color: var(--soft); font-size: 11px; line-height: 1.5; }
  .cta { display: grid; gap: 7px; }
  .soldout { background: var(--sold); color: var(--navy); text-align: center; padding: 11px; font-size: 12.5px; }

  /* Shared button bits */
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  svg.bell { width: 15px; height: 15px; flex: none; }
  .b-white, .b-frame, .b-grad { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 12px; width: 100%; font-size: 12.5px; font-weight: 500; transition: background-color .2s, color .2s, filter .2s; }
  .b-white { background: var(--white); color: var(--navy); }
  .b-white:hover { background: #dfe2f2; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--soft); }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--soft); }

  /* 2: frame with arrow */
  .b-frame { border: 1px solid var(--white); justify-content: space-between; padding: 7px 7px 7px 14px; }
  .b-frame em { width: 26px; height: 26px; border-radius: 50%; background: var(--white); color: var(--navy); display: grid; place-items: center; font-style: normal; flex: none; transition: transform .2s; }
  .b-frame:hover { background: var(--white); color: var(--navy); }
  .b-frame:hover em { background: var(--navy); color: var(--white); transform: translateX(-2px); }

  /* 3: email field in the page */
  .inline-t { font-weight: 500; }
  .inline-f { display: flex; align-items: center; border-bottom: 1px solid var(--white); padding: 4px 0 7px; color: var(--soft); justify-content: space-between; }
  .inline-f em { width: 26px; height: 26px; border-radius: 50%; background: var(--white); color: var(--navy); display: grid; place-items: center; font-style: normal; }

  /* 4: soft card */
  .soft { background: var(--navy-2); border: 1px solid rgb(255 255 255 / .16); border-radius: 12px; padding: 11px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; }
  .soft .ic { width: 30px; height: 30px; border-radius: 50%; background: var(--white); color: var(--navy); display: grid; place-items: center; grid-row: span 2; }
  .soft strong { font: 500 14px/1.25 var(--head); }
  .soft p { margin: 0; font-size: 11.5px; line-height: 1.45; color: var(--soft); }
  .soft .b-white { grid-column: 1 / -1; margin-top: 7px; border-radius: 99px; padding: 9px; }

  /* 5: one split bar */
  .split { display: grid; grid-template-columns: 2fr 3fr; }
  .split .soldout { display: grid; place-items: center; padding: 0 4px; }

  /* 6: side tab */
  .tab { position: absolute; right: 0; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; rotate: 180deg; display: flex; align-items: center; gap: 8px; padding: 14px 8px; font-size: 12px; font-weight: 500; z-index: 2; }
  .tab svg { rotate: 90deg; }
  .tab.old { background: #202223; color: var(--white); padding: 14px 10px; }
  .tab.new { background: var(--white); color: var(--navy); border-radius: 0 12px 12px 0; box-shadow: 0 4px 22px rgb(0 0 0 / .35); }
  .phone .tab { top: 64px; padding-block: 10px; }

  /* 7: floating pill with the same ring as the music bar */
  .pill { position: absolute; left: 50%; bottom: 14px; translate: -50% 0; display: flex; align-items: center; gap: 7px; white-space: nowrap; background: var(--white); color: var(--navy); border-radius: 99px; padding: 9px 15px; font-size: 12px; font-weight: 500; box-shadow: 0 6px 24px rgb(0 0 0 / .4); z-index: 2; }
  .pill::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--white); animation: ring 2.8s ease-out infinite; pointer-events: none; }
  @keyframes ring { 0% { transform: scale(1); opacity: .8; } 45%, 100% { transform: scale(1.22, 1.55); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pill::after { animation: none; opacity: 0; } }
  .phone .pill { top: 92px; bottom: auto; }
  .pdp .pill { left: 19%; }

  /* 8: the announcement bar gradient */
  .b-grad { color: var(--white); border: 1px solid rgb(255 255 255 / .3); background: linear-gradient(90deg, var(--sky), var(--navy-2) 55%, var(--navy)); }
  .b-grad:hover { filter: brightness(1.15); }

  /* Music pill, for context where something floats */
  .music { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; background: var(--navy); border: 1px solid var(--hair); border-radius: 99px; padding: 4px 10px 4px 4px; font-size: 8.5px; letter-spacing: .04em; z-index: 1; }
  .music::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, #667 18%, #111 20%); }
  .phone .music { display: none; }

  /* Signup forms */
  .pop { min-height: 410px; display: grid; place-items: center; padding: 16px; isolation: isolate; font-size: 12.5px; }
  .pop::before { content: ""; position: absolute; inset: 0; background: var(--photo) center 25% / cover; z-index: -2; }
  .pop::after { content: ""; position: absolute; inset: 0; background: rgb(0 0 0 / .45); z-index: -1; }
  .box { width: 100%; max-width: 310px; display: grid; gap: 10px; padding: 16px; position: relative; }
  .box h4 { margin: 0; font: 500 18px/1.2 var(--head); display: flex; align-items: center; gap: 7px; }
  .box p { margin: 0; line-height: 1.45; }
  .x { position: absolute; top: 12px; right: 13px; font-size: 15px; line-height: 1; }
  .field { padding: 9px 11px; border: 1px solid var(--navy-2); border-radius: 6px; display: flex; justify-content: space-between; }
  .send { padding: 11px; text-align: center; font-weight: 500; width: 100%; }
  .terms { font-size: 10px; line-height: 1.4; }
  .mark { width: 14px; height: 14px; border-radius: 3px; background: #6b21a8; justify-self: end; margin-top: -4px; }
  .old-box { background: var(--navy); border-radius: 10px; } .old-box p, .old-box .terms { color: var(--soft); } .old-box .ph { color: var(--soft); }
  .old-box .send { background: var(--white); color: var(--navy); }

  .white-box { background: var(--white); color: var(--navy); border-radius: 14px; box-shadow: 0 16px 50px rgb(0 0 0 / .4); }
  .white-box .field { border-color: #c9cfdf; color: #5b6390; }
  .white-box p, .white-box .terms { color: #5b6390; }
  .white-box .send { background: var(--navy); color: var(--white); border-radius: 99px; }

  .thumb-box { background: var(--navy); border: 1px solid var(--hair); border-radius: 4px; }
  .thumb-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 11px; align-items: center; padding-right: 16px; }
  .thumb { height: 74px; background: var(--photo) center 22% / cover; }
  .eyebrow { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
  .thumb-row b { display: block; font: 500 15px/1.2 var(--head); }
  .thumb-row small { color: var(--soft); font-size: 11px; }
  .line { border-bottom: 1px solid var(--white); padding: 9px 0; color: var(--soft); }
  .thumb-box .send { background: var(--white); color: var(--navy); }
  .thumb-box .terms { color: var(--soft); }

  .pop.drawer { place-items: stretch end; padding: 0; }
  .drawer-box { background: var(--navy); width: 66%; min-height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 16px 14px; position: relative; }
  .drawer-box h4 { margin: 0; font: 500 18px/1.2 var(--head); }
  .drawer-img { flex: 1; min-height: 100px; background: var(--photo) center 22% / cover; }
  .drawer-box .send { background: var(--white); color: var(--navy); }
  .drawer-box .terms, .drawer-box .ph { color: var(--soft); }

  .pop.sheet { place-items: end center; padding: 10px; }
  .glass { background: rgb(255 255 255 / .16); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid rgb(255 255 255 / .34); border-radius: 22px; }
  .glass .field { border-color: rgb(255 255 255 / .5); border-radius: 99px; padding-inline: 14px; background: rgb(11 13 71 / .28); }
  .glass .send { background: var(--white); color: var(--navy); border-radius: 99px; }
  .glass .terms { color: rgb(255 255 255 / .85); }

  .pop.inplace { background: var(--navy); place-items: center stretch; }
  .pop.inplace::before, .pop.inplace::after { display: none; }
  .inplace .panel { padding: 8px; }
  .morph { border: 1px solid var(--white); padding: 11px 12px; display: grid; gap: 9px; }
  .morph .top { display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
  .morph .send { background: var(--white); color: var(--navy); }
  .morph .line { padding-top: 2px; }
</style>

</head>
<body>
<main class="wrap" dir="rtl">
  <header>
    <h1>زرار Notify me: أشكال أحدث وأوضح</h1>
    <p class="lead">كله على صفحة منتج حقيقية و Baby pink خلصان. تقدر تمرر الماوس على الزراير تشوف الـ hover. وكل شكل معاه هو هيبان إزاي على الموبايل.</p>
  </header>

  <h2>شكل الزرار</h2>
  <section class="grid-btn" id="buttons"></section>

  <h2>الفورم اللي بتفتح بعد الضغط</h2>
  <p class="lead">أي فورم منهم ينفع مع أي زرار من اللي فوق.</p>
  <section class="grid-pop" id="forms"></section>
</main>
