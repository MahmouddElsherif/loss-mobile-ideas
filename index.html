  :root { --bg: #f3f4f8; --card: #fff; --ink: #1c2a68; --muted: #5b6390; --line: #c9cfdf; --red: #e3000f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11152b; --card: #1a1f3a; --ink: #eef0fa; --muted: #a9b0d6; --line: #2c3460; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, "Segoe UI", Tahoma, sans-serif; }
  header { padding: 28px 16px 8px; max-width: 1200px; margin: auto; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  header p { margin: 0; color: var(--muted); }
  nav { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; overflow-x: auto; white-space: nowrap; }
  nav a { display: inline-block; margin-inline-end: 8px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); text-decoration: none; font-size: 13px; }
  section { max-width: 1200px; margin: auto; padding: 24px 16px 8px; }
  h2 { margin: 0 0 4px; font-size: 21px; }
  h2 small { font-weight: 400; color: var(--muted); font-size: 14px; }
  .note { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  figcaption { padding: 10px 12px 12px; }
  figcaption b { display: block; margin-bottom: 2px; }
  figcaption span { color: var(--muted); font-size: 13.5px; }
  .tag { display: inline-block; background: var(--red); color: #fff; border-radius: 6px; padding: 0 7px; font-size: 12px; margin-inline-start: 6px; vertical-align: middle; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; }
  dialog::backdrop { background: rgba(0,0,0,.8); }
  dialog img { max-height: 92vh; max-width: 96vw; display: block; border-radius: 10px; }
</style>

  const sec = document.createElement('section'); sec.id = s.id;

  for (const [src, t, d] of s.items) sec.querySelector('.grid').insertAdjacentHTML('beforeend',
    `<figure><img loading="lazy" src="${src}" alt="${t}"><figcaption><b>${t}</b><span>${d}</span></figcaption></figure>`);
  main.appendChild(sec);
}
const zoom = document.getElementById('zoom');
main.addEventListener('click', e => { if (e.target.tagName === 'IMG') { zoom.querySelector('img').src = e.target.src; zoom.showModal(); } });
zoom.addEventListener('click', () => zoom.close());
