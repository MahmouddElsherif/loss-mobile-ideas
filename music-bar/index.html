<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loss Music Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f3f4f8; --card: #fff; --ink: #1c2a68; --muted: #5b6390; --line: #c9cfdf; --navy: #1c2a68; --cream: #ece7dc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11152b; --card: #1a1f3a; --ink: #eef0fa; --muted: #a9b0d6; --line: #2c3460; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, "Segoe UI", Tahoma, sans-serif; }
  header.page { padding: 28px 16px 8px; max-width: 1280px; margin: auto; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  header.page p { margin: 0; color: var(--muted); }
  main { max-width: 1280px; margin: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  figcaption { padding: 12px 2px 0; }
  figcaption b { display: block; margin-bottom: 2px; }
  figcaption span { color: var(--muted); font-size: 13.5px; }
  .tag { display: inline-block; border-radius: 6px; padding: 0 7px; font-size: 12px; margin-inline-start: 6px; vertical-align: middle; color: #fff; background: #1f8a4c; }
  .tag.ref { background: #6b7280; }
  .notes { max-width: 1280px; margin: auto; padding: 4px 16px 40px; }
  .notes h2 { font-size: 19px; margin: 18px 0 6px; }
  .notes li { margin-bottom: 4px; }

  /* Phone: a 360px-wide screen with the collection grid behind the player */
  .phone { direction: ltr; width: 100%; max-width: 320px; margin: auto; border: 8px solid #111; border-radius: 34px; overflow: hidden; background: #111; }
  .screen { position: relative; aspect-ratio: 360 / 700; overflow: hidden; background: #fff; font-family: Geist, sans-serif; }
  .hdr { position: relative; z-index: 3; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; color: var(--navy); background: #fff; border-bottom: 1px solid #e6e8f0; }
  .hdr .side { display: flex; gap: 14px; align-items: center; width: 74px; }
  .hdr .side:last-child { justify-content: flex-end; }
  .hdr svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .hdr img { height: 26px; }
  .shelf { padding: 14px 10px 0; }
  .shelf h3 { margin: 0 0 10px; font: 500 10px Geist, sans-serif; letter-spacing: .25em; text-transform: uppercase; color: var(--navy); text-align: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 6px; }
  .grid img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
  .grid p { margin: 5px 0 0; font-size: 10px; line-height: 1.3; color: #222; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; padding: 0; background: none; }
  button:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }

  /* Shared pieces */
  .on, .phone[data-on] .off { display: none !important; }
  .phone[data-on] .on { display: inline-flex !important; }
  .vinyl { position: relative; display: block; flex: none; border-radius: 50%; background: radial-gradient(circle, transparent 0 33%, rgb(255 255 255 / .1) 34% 35%, transparent 36%), repeating-radial-gradient(circle, #111 0 1.5px, #1e1e1e 1.5px 3px); }
  .vinyl::before { content: ""; position: absolute; inset: 31%; border-radius: 50%; background: var(--navy) url(img/logo-loss-white.png) center / 72% no-repeat; }
  .vinyl::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 20deg, transparent 0 18%, rgb(255 255 255 / .18) 24%, transparent 30% 68%, rgb(255 255 255 / .1) 74%, transparent 80%); }
  .phone[data-on] .spin { animation: spin 3s linear infinite; }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
  .eq i { width: 2px; height: 100%; border-radius: 1px; background: currentColor; transform-origin: bottom; transform: scaleY(.25); }
  .phone[data-on] .eq i { animation: eq .9s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-duration: .7s !important; animation-delay: -.3s !important; }
  .eq i:nth-child(3) { animation-duration: 1.1s !important; animation-delay: -.5s !important; }
  .eq i:nth-child(4) { animation-duration: .8s !important; animation-delay: -.2s !important; }
  .ico { width: 12px; height: 12px; fill: currentColor; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes eq { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
  @keyframes ring { from { opacity: .6; transform: scale(1); } to { opacity: 0; transform: scale(1.45); } }

  /* 0. Current: record with a tonearm */
  .o0 { position: absolute; right: 16px; bottom: 34px; width: 52px; height: 52px; }
  .o0 .vinyl { width: 100%; height: 100%; box-shadow: 0 6px 18px rgb(0 0 0 / .3); }
  .o0 .arm { position: absolute; top: -5px; right: -4px; width: 5px; height: 32px; border-radius: 9px; background: linear-gradient(90deg, #aeb5c9, #e3e6ef 50%, #aeb5c9); transform-origin: 50% 6%; transform: rotate(-4deg); transition: transform .6s; }
  .phone[data-on] .o0 .arm { transform: rotate(26deg); }
  .o0 .bars { position: absolute; top: calc(100% + 6px); left: 50%; translate: -50% 0; padding: 3px 6px; border-radius: 99px; background: #fff; color: var(--navy); box-shadow: 0 2px 6px rgb(0 0 0 / .15); opacity: 0; }
  .phone[data-on] .o0 .bars { opacity: 1; }

  /* 1. Dock pill (like eighties) */
  .o1 { position: absolute; left: 12px; bottom: 16px; display: flex; align-items: center; gap: 9px; padding: 5px 16px 5px 5px; border-radius: 999px; background: rgb(20 27 64 / .94); color: #fff; text-align: left; box-shadow: 0 8px 20px rgb(0 0 0 / .25); }
  .o1 .vinyl { width: 34px; height: 34px; }
  .o1 small { display: block; font-size: 7.5px; font-weight: 600; letter-spacing: .16em; opacity: .6; }
  .o1 b { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; }
  .o1 .eq { margin-left: 4px; }

  /* 2. Navy circle with bars inside */
  .o2 { position: absolute; right: 16px; bottom: 20px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--navy); color: #fff; box-shadow: 0 6px 16px rgb(28 42 104 / .35); }
  .o2 .eq { height: 16px; gap: 3px; }
  .o2 .eq i { width: 3px; }
  .o2 svg { width: 18px; height: 18px; fill: currentColor; }
  .o2::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--navy); opacity: 0; }
  .phone[data-on] .o2::after { animation: ring 1.6s ease-out infinite; }

  /* 3. Cassette */
  .o3 { position: absolute; right: 14px; bottom: 18px; width: 82px; padding: 5px 7px 6px; border-radius: 6px; background: var(--cream); border: 1.5px solid var(--navy); color: var(--navy); box-shadow: 0 6px 14px rgb(0 0 0 / .18); }
  .o3 .lbl { display: flex; justify-content: space-between; font-size: 6.5px; font-weight: 600; letter-spacing: .14em; }
  .o3 .win { display: flex; justify-content: space-between; align-items: center; height: 22px; margin-top: 4px; padding: 0 7px; border-radius: 11px; background: var(--navy); }
  .o3 .reel { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; background: radial-gradient(circle, #fff 0 18%, transparent 20%), conic-gradient(#fff 0 8%, transparent 8% 33%, #fff 33% 41%, transparent 41% 66%, #fff 66% 74%, transparent 74%); }
  .o3 .tape { flex: 1; height: 8px; margin: 0 4px; border-radius: 2px; background: #5a4a3a; }

  /* 4. Record that opens into a pill with the song name */
  .o4 { position: absolute; right: 14px; bottom: 18px; display: flex; align-items: center; max-width: 48px; height: 48px; padding: 4px; border-radius: 999px; background: #fff; color: var(--navy); text-align: left; overflow: hidden; box-shadow: 0 6px 18px rgb(0 0 0 / .18); transition: max-width .55s cubic-bezier(.2, .8, .2, 1); }
  .phone[data-on] .o4 { max-width: 230px; }
  .o4 .vinyl { width: 40px; height: 40px; }
  .o4 .play { position: absolute; left: 4px; top: 4px; width: 40px; height: 40px; display: grid; place-items: center; }
  .o4 .play span { display: grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: #fff; }
  .o4 .play svg { width: 8px; height: 8px; fill: var(--navy); margin-left: 1px; }
  .o4 .txt { padding: 0 10px; white-space: nowrap; }
  .o4 .txt b { display: block; font-size: 11px; font-weight: 600; }
  .o4 .txt small { display: block; font-size: 9px; opacity: .6; }
  .o4 .pause { display: grid; place-items: center; flex: none; width: 30px; height: 30px; margin-right: 4px; border-radius: 50%; background: var(--navy); color: #fff; }

  /* 5. Tab on the side of the screen */
  .o5 { position: absolute; right: 0; top: 58%; display: flex; align-items: center; gap: 8px; padding: 12px 7px; writing-mode: vertical-rl; transform: rotate(180deg); border-radius: 0 8px 8px 0; background: var(--navy); color: #fff; font-size: 8.5px; font-weight: 600; letter-spacing: .22em; box-shadow: 0 4px 12px rgb(0 0 0 / .2); }
  .o5 .dot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid #fff; }
  .phone[data-on] .o5 .dot { background: #fff; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  /* 6. Just a word in the theme's button frame */
  .o6 { position: absolute; left: 12px; bottom: 18px; display: flex; align-items: center; gap: 9px; padding: 10px 13px 10px 15px; background: rgb(255 255 255 / .88); backdrop-filter: blur(6px); box-shadow: inset 0 0 0 1px rgb(28 42 104 / .65); color: var(--navy); font-size: 9.5px; font-weight: 500; letter-spacing: .24em; }
  .o6 .eq { height: 10px; }

  /* 7. Small card with a progress line */
  .o7 { position: absolute; left: 10px; bottom: 12px; display: flex; align-items: center; gap: 10px; width: 236px; padding: 7px 8px 7px 7px; border-radius: 14px; background: rgb(255 255 255 / .8); backdrop-filter: blur(14px); color: var(--navy); text-align: left; box-shadow: 0 8px 24px rgb(0 0 0 / .16), inset 0 0 0 1px rgb(255 255 255 / .6); }
  .o7 .art { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; background: var(--navy) url(img/logo-loss-white.png) center / 70% no-repeat; }
  .o7 .t { flex: 1; min-width: 0; }
  .o7 b { display: block; font-size: 10.5px; font-weight: 600; }
  .o7 small { display: block; font-size: 8.5px; opacity: .6; }
  .o7 .prog { display: block; height: 2px; margin-top: 5px; border-radius: 2px; background: rgb(28 42 104 / .15); }
  .o7 .prog i { display: block; width: var(--p, 0%); height: 100%; border-radius: 2px; background: var(--navy); }
  .o7 .pp { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; }

  /* 8. Sound wave pill */
  .o8 { position: absolute; right: 14px; bottom: 18px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px; background: var(--navy); color: #fff; box-shadow: 0 6px 16px rgb(28 42 104 / .3); }
  .o8 .pp { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; color: var(--navy); }
  .o8 .wv { position: relative; width: 56px; height: 20px; overflow: hidden; }
  .o8 svg.w { position: absolute; left: 0; top: 0; width: 112px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.6; transform: scaleY(.08); transition: transform .5s; }
  .o8 svg.w path { vector-effect: non-scaling-stroke; }
  .o8 svg.w2 { opacity: .4; }
  .phone[data-on] .o8 svg.w { transform: scaleY(1); animation: wave 1.4s linear infinite; }
  .phone[data-on] .o8 svg.w2 { transform: scaleY(.6); animation-duration: 2.2s; }
  @keyframes wave { from { translate: 0 0; } to { translate: -32px 0; } }

  /* 9. Record sleeve, the record slides out while playing */
  .o9 { position: absolute; right: 34px; bottom: 20px; width: 50px; height: 50px; }
  .o9 .out { position: absolute; left: 3px; top: 3px; width: 44px; height: 44px; transition: transform .7s cubic-bezier(.2, .8, .2, 1); transform: translateX(6px); }
  .phone[data-on] .o9 .out { transform: translateX(24px); }
  .o9 .vinyl { width: 100%; height: 100%; }
  .o9 .sleeve { position: absolute; inset: 0; border-radius: 3px; background: var(--navy) url(img/logo-loss-white.png) center 42% / 62% no-repeat; box-shadow: 2px 4px 12px rgb(0 0 0 / .3); }
  .o9 .sleeve span { position: absolute; left: 5px; bottom: 4px; color: #fff; }
  .o9 .sleeve .ico { width: 9px; height: 9px; }

  /* 10. Speaker in the header, nothing floating */
  .o10 { display: grid; place-items: center; }
  .o10 svg .w, .phone[data-on] .o10 svg .x { display: none; }
  .phone[data-on] .o10 svg .w { display: inline; }
  .np { position: absolute; z-index: 2; left: 0; right: 0; top: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 26px; background: var(--navy); color: #fff; font-size: 9px; letter-spacing: .14em; transform: translateY(-100%); transition: transform .45s; }
  .phone[data-on] .np { transform: none; }

  /* 11. Dynamic Island: opens big for a moment when the song starts, then stays compact */
  .o11 { position: absolute; z-index: 4; top: 58px; left: 50%; translate: -50% 0; display: flex; align-items: center; gap: 8px; width: 124px; height: 30px; padding: 0 10px 0 5px; border-radius: 999px; background: #000; color: #fff; text-align: left; overflow: hidden; box-shadow: 0 6px 18px rgb(0 0 0 / .3); transition: width .55s cubic-bezier(.3, 1.35, .5, 1), height .55s cubic-bezier(.3, 1.35, .5, 1), border-radius .55s, padding .55s; }
  .o11 .vinyl { width: 20px; height: 20px; transition: width .5s, height .5s; }
  .o11 .lbl { flex: 1; font-size: 7.5px; font-weight: 600; letter-spacing: .18em; white-space: nowrap; }
  .o11 .mid { display: none; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
  .o11 .mid b { display: block; font-size: 11px; font-weight: 600; }
  .o11 .mid small { display: block; font-size: 9px; opacity: .55; }
  .o11 .eq { color: #9fb0ff; }
  .o11 .ico { width: 10px; height: 10px; }
  .o11.big { width: 262px; height: 66px; padding: 0 16px 0 11px; border-radius: 26px; }
  .o11.big .vinyl { width: 44px; height: 44px; }
  .o11.big .lbl { display: none; }
  .o11.big .mid { display: block; animation: fade .4s .15s both; }
  .o11.big .eq { height: 16px; gap: 3px; }
  .o11.big .eq i { width: 3px; }
  @keyframes fade { from { opacity: 0; } }

  /* 12. Old iPod with a click wheel */
  .o12 { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 66px; padding: 6px 6px 8px; border-radius: 11px; background: linear-gradient(160deg, #fdfdfe, #d6d9e1); box-shadow: 0 8px 18px rgb(0 0 0 / .25), inset 0 0 0 1px rgb(255 255 255 / .9); }
  .o12 .scr { width: 100%; height: 40px; padding: 3px 4px; border-radius: 3px; background: linear-gradient(#edf1f7, #cbd4e1); box-shadow: inset 0 0 0 1px #9aa3b5; color: #1a1f33; text-align: left; font-size: 5px; line-height: 1.3; }
  .o12 .scr .top { display: flex; justify-content: space-between; padding-bottom: 2px; margin-bottom: 2px; border-bottom: .5px solid #8b94a8; font-weight: 600; }
  .o12 .scr b { display: block; font-size: 6.5px; font-weight: 600; white-space: nowrap; }
  .o12 .scr .prog { display: block; height: 2.5px; margin-top: 3px; border: .5px solid #5d6680; }
  .o12 .scr .prog i { display: block; width: var(--p, 0%); height: 100%; background: #5d6680; }
  .o12 .wheel { position: relative; width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(#eef0f4, #d3d7df); box-shadow: inset 0 1px 2px rgb(0 0 0 / .18); color: #9aa0ad; font-size: 4.5px; font-weight: 600; }
  .o12 .wheel span { position: absolute; }
  .o12 .wheel .n { top: 4px; left: 50%; translate: -50% 0; }
  .o12 .wheel .s { bottom: 3px; left: 50%; translate: -50% 0; }
  .o12 .wheel .w { left: 4px; top: 50%; translate: 0 -50%; }
  .o12 .wheel .e { right: 4px; top: 50%; translate: 0 -50%; }
  .o12 .wheel .ctr { inset: 14px; border-radius: 50%; background: linear-gradient(#fafbfc, #e3e6ec); box-shadow: 0 1px 2px rgb(0 0 0 / .2); }

  /* 13. Two VU meters with swinging needles, like old hi-fi amps */
  .o13 { position: absolute; left: 12px; bottom: 16px; padding: 6px 6px 4px; border-radius: 7px; background: var(--navy); box-shadow: 0 8px 18px rgb(0 0 0 / .28); }
  .o13 .m { display: flex; gap: 5px; }
  .o13 svg { display: block; width: 52px; height: 34px; border-radius: 3px; background: radial-gradient(ellipse at 50% 100%, #fff7de, #ecdcae); filter: brightness(.82); transition: filter .5s, box-shadow .5s; }
  .phone[data-on] .o13 svg { filter: brightness(1.05); box-shadow: 0 0 10px rgb(255 205 110 / .55); }
  .o13 .arc { fill: none; stroke: #1c2a68; stroke-width: .8; }
  .o13 .red { fill: none; stroke: #c8102e; stroke-width: 1.6; }
  .o13 .tk { stroke: #1c2a68; stroke-width: .6; }
  .o13 text { font: 600 4.5px Geist, sans-serif; fill: #1c2a68; letter-spacing: .1em; }
  .o13 .needle { stroke: #111; stroke-width: .9; transform-box: view-box; transform-origin: 26px 33px; transform: rotate(-44deg); transition: transform .6s; }
  .phone[data-on] .o13 .needle { animation: vu 1.3s ease-in-out infinite alternate; }
  .phone[data-on] .o13 svg + svg .needle { animation-duration: 1.05s; animation-delay: -.4s; }
  .o13 .foot { display: flex; justify-content: space-between; align-items: center; padding: 4px 2px 0; color: #efe4c4; font-size: 5.5px; font-weight: 600; letter-spacing: .22em; }
  .o13 .led { width: 4px; height: 4px; border-radius: 50%; background: #5a1420; }
  .phone[data-on] .o13 .led { background: #ff3b4e; box-shadow: 0 0 5px #ff3b4e; animation: blink .9s steps(2) infinite; }
  @keyframes vu { 0% { transform: rotate(-30deg); } 15% { transform: rotate(10deg); } 30% { transform: rotate(-14deg); } 45% { transform: rotate(24deg); } 60% { transform: rotate(-4deg); } 75% { transform: rotate(32deg); } 90% { transform: rotate(6deg); } 100% { transform: rotate(18deg); } }

  /* 14. Radio dial that tunes in to the store's own station */
  .o14 { position: absolute; left: 12px; bottom: 14px; display: flex; align-items: center; gap: 9px; width: 214px; padding: 7px 9px 7px 7px; border-radius: 10px; background: var(--navy); box-shadow: 0 8px 20px rgb(0 0 0 / .28); }
  .o14 .win { position: relative; flex: 1; height: 38px; padding: 3px 6px 0; border-radius: 4px; background: linear-gradient(#f5edd8, #e4d6b0); color: var(--navy); overflow: hidden; filter: brightness(.85); transition: filter .6s, box-shadow .6s; }
  .phone[data-on] .o14 .win { filter: brightness(1.06); box-shadow: inset 0 0 14px rgb(255 190 80 / .55); }
  .o14 .row { display: flex; justify-content: space-between; font-size: 6px; font-weight: 600; letter-spacing: .14em; }
  .o14 .row.nums { margin-top: 3px; font-size: 6.5px; letter-spacing: 0; }
  .o14 .ticks { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 7px; background: repeating-linear-gradient(90deg, rgb(28 42 104 / .7) 0 1px, transparent 1px 5px); mask: linear-gradient(#000 0 0) bottom / 100% 4px no-repeat; }
  .o14 .ticks::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgb(28 42 104 / .8) 0 1px, transparent 1px 25px); }
  .o14 .needle { position: absolute; top: 2px; bottom: 2px; left: 8%; width: 1.5px; background: #d0142c; box-shadow: 0 0 3px rgb(208 20 44 / .6); transition: left 1.5s cubic-bezier(.25, 1.45, .5, 1); }
  .phone[data-on] .o14 .needle { left: 51.5%; }
  .o14 .knob { position: relative; flex: none; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f3f4f8, #aab0c2 70%); box-shadow: 0 2px 4px rgb(0 0 0 / .4), inset 0 0 0 2px rgb(255 255 255 / .35); transition: transform 1.5s cubic-bezier(.25, 1.2, .5, 1); }
  .o14 .knob::after { content: ""; position: absolute; top: 3px; left: 50%; width: 2px; height: 8px; margin-left: -1px; border-radius: 1px; background: var(--navy); }
  .phone[data-on] .o14 .knob { transform: rotate(210deg); }

  /* 15. Badge with the words spinning around the play button */
  .o15 { position: absolute; right: 12px; bottom: 14px; width: 74px; height: 74px; border-radius: 50%; background: #fff; color: var(--navy); box-shadow: 0 8px 20px rgb(0 0 0 / .2); }
  .o15 .ring { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 26s linear infinite; }
  .phone[data-on] .o15 .ring { animation-duration: 7s; }
  .o15 text { font: 600 7px Geist, sans-serif; letter-spacing: .12em; fill: var(--navy); transition: opacity .4s; }
  .o15 .t-on, .phone[data-on] .o15 .t-off { opacity: 0; }
  .phone[data-on] .o15 .t-on { opacity: 1; }
  .o15 .c { position: absolute; inset: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--navy); color: #fff; }
  .o15 .c::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--navy); opacity: 0; }
  .phone[data-on] .o15 .c::after { animation: ring 1.6s ease-out infinite; }

  .round { max-width: 1280px; margin: auto; padding: 24px 16px 0; }
  .round h2 { margin: 0 0 4px; font-size: 21px; }
  .round p { margin: 0; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<audio id="song" src="song.mp3" preload="none" loop></audio>

<header class="page">
  <h1>أشكال الـ Music bar</h1>
  <p>الأول هو اللي عندنا دلوقتي، وبعده 15 شكل. كلهم شغالين: دوس على أي واحد والأغنية هتشتغل والشكل هيتحرك، ودوس تاني يقف.</p>
</header>

<main>
  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o0" data-toggle aria-pressed="false" aria-label="Play music"><span class="vinyl spin"></span><span class="arm"></span><span class="bars"><span class="eq"><i></i><i></i><i></i><i></i></span></span></button>
    </div></div>
    <figcaption><b>0. الحالي <span class="tag ref">للمقارنة</span></b>
      <span>الأسطوانة بالذراع اللي بينزل عليها، والبارات بتظهر تحتها وهي شغالة.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o1" data-toggle aria-pressed="false" aria-label="Play music"><span class="vinyl spin"></span><span><small class="off">PRESS PLAY</small><small class="on">NOW PLAYING</small><b>ENDING CREDITS</b></span><span class="eq"><i></i><i></i><i></i></span></button>
    </div></div>
    <figcaption><b>1. شريط زي eighties</b>
      <span>أسطوانة صغيرة جنبها اسم الأغنية، ومكتوب فوقه PRESS PLAY ويتغير لـ NOW PLAYING. نفس فكرة eighties بس كحلي بلوجو Loss. واضح إن فيه مزيكا من غير ما حد يسأل.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o2" data-toggle aria-pressed="false" aria-label="Play music"><svg class="off" viewBox="0 0 24 24"><path d="M9 17.5a2.5 2.5 0 1 1-2-2.45V5l11-2v12.5a2.5 2.5 0 1 1-2-2.45V6.4l-7 1.3z"/></svg><span class="eq on"><i></i><i></i><i></i><i></i></span></button>
    </div></div>
    <figcaption><b>2. دايرة كحلي</b>
      <span>أبسط واحدة: دايرة فيها علامة مزيكا، ولما تشتغل العلامة تتحول لبارات بتتحرك ودايرة خفيفة بتنبض حواليها. صغيرة ومش بتاخد مكان.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o3" data-toggle aria-pressed="false" aria-label="Play music"><span class="lbl"><span>LOSS MIX</span><span class="off">▶</span><span class="on">❚❚</span></span><span class="win"><span class="reel spin"></span><span class="tape"></span><span class="reel spin"></span></span></button>
    </div></div>
    <figcaption><b>3. شريط كاسيت</b>
      <span>كاسيت صغير بلون كريمي وإطار كحلي، والبكرتين بيلفوا وهو شغال. فيه روح قديمة شبه الأسطوانة بس مختلف عن اللي عند eighties.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o4" data-toggle aria-pressed="false" aria-label="Play music"><span class="vinyl spin"></span><span class="play off"><span><svg viewBox="0 0 12 12"><path d="M3 1.5v9L10.5 6z"/></svg></span></span><span class="txt"><b>Ending Credits</b><small>Opeth</small></span><span class="pause"><svg class="ico" viewBox="0 0 12 12"><path d="M3 2h2.2v8H3zM6.8 2H9v8H6.8z"/></svg></span></button>
    </div></div>
    <figcaption><b>4. أسطوانة بتتفتح</b>
      <span>وهي واقفة: أسطوانة صغيرة بس. لما تشتغل تتفرد لشريط أبيض فيه اسم الأغنية وزرار إيقاف. صغيرة طول ما مفيش مزيكا، وهادية مع البراند.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o5" data-toggle aria-pressed="false" aria-label="Play music"><span class="dot"></span><span class="off">SOUND OFF</span><span class="on">SOUND ON</span></button>
    </div></div>
    <figcaption><b>5. تاب على جنب الشاشة</b>
      <span>شريط كحلي رفيع لازق في حافة الشاشة ومكتوب عليه SOUND ON / OFF بالطول. مش بيغطي على أي حاجة تحت، ولا على زرار الإضافة للسلة.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o6" data-toggle aria-pressed="false" aria-label="Play music">SOUND <span class="off">OFF</span><span class="on">ON</span><span class="eq"><i></i><i></i><i></i><i></i></span></button>
    </div></div>
    <figcaption><b>6. كلمة بس</b>
      <span>SOUND OFF / ON بنفس شكل زراير الموقع (إطار رفيع وحروف متباعدة). أهدى واحدة فيهم، شبه مواقع الفاشون الكبيرة.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o7" data-toggle aria-pressed="false" aria-label="Play music"><span class="art"></span><span class="t"><b>Ending Credits</b><small>Opeth · Damnation</small><span class="prog"><i></i></span></span><span class="pp"><svg class="ico off" viewBox="0 0 12 12"><path d="M3.5 1.5v9L10.5 6z"/></svg><svg class="ico on" viewBox="0 0 12 12"><path d="M3 2h2.2v8H3zM6.8 2H9v8H6.8z"/></svg></span></button>
    </div></div>
    <figcaption><b>7. كارت صغير بخط تقدم</b>
      <span>زي ميني بلاير: صورة باللوجو، اسم الأغنية والفنان، وخط رفيع بيمشي مع الأغنية. شكله زجاج شفاف. أوضح واحدة بس أكبرهم، فلازم يختفي في صفحة المنتج.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o8" data-toggle aria-pressed="false" aria-label="Play music"><span class="pp"><svg class="ico off" viewBox="0 0 12 12"><path d="M3.5 1.5v9L10.5 6z"/></svg><svg class="ico on" viewBox="0 0 12 12"><path d="M3 2h2.2v8H3zM6.8 2H9v8H6.8z"/></svg></span><span class="wv"><svg class="w w2" viewBox="0 0 112 20"><path d="M0 10Q8 1 16 10T32 10T48 10T64 10T80 10T96 10T112 10"/></svg><svg class="w" viewBox="0 0 112 20"><path d="M0 10Q8 1 16 10T32 10T48 10T64 10T80 10T96 10T112 10"/></svg></span></button>
    </div></div>
    <figcaption><b>8. موجة صوت</b>
      <span>وهي واقفة: خط مستقيم. لما تشتغل الخط يبقى موجة بتجري. بديل أنعم من البارات.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o9" data-toggle aria-pressed="false" aria-label="Play music"><span class="out"><span class="vinyl spin"></span></span><span class="sleeve"><span><svg class="ico off" viewBox="0 0 12 12"><path d="M3.5 1.5v9L10.5 6z"/></svg><svg class="ico on" viewBox="0 0 12 12"><path d="M3 2h2.2v8H3zM6.8 2H9v8H6.8z"/></svg></span></span></button>
    </div></div>
    <figcaption><b>9. غلاف أسطوانة</b>
      <span>غلاف كحلي مربع باللوجو، والأسطوانة باينة منه حتة صغيرة. لما تشتغل الأسطوانة تطلع من الغلاف وتلف. نفس فكرة الأسطوانة الحالية بس بحركة أحلى.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop data-speaker>
      <div class="np"><span class="eq"><i></i><i></i><i></i></span>NOW PLAYING · ENDING CREDITS</div>
    </div></div>
    <figcaption><b>10. في الهيدر</b>
      <span>مفيش حاجة عايمة خالص: أيقونة سماعة جنب السلة. لما تشتغل ينزل شريط كحلي رفيع تحت الهيدر مكتوب فيه اسم الأغنية. الشاشة بتفضل نضيفة، بس الزرار أقل وضوحا.</span></figcaption>
  </figure>
</main>

<section class="round">
  <h2>أفكار مبتكرة أكتر</h2>
  <p>5 أشكال واخدة روحها من أجهزة وحاجات مزيكا حقيقية. شغلها بالصوت عشان الحركة هي اللي بتفرق فيهم.</p>
</section>
<main>
  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o11" data-toggle aria-pressed="false" aria-label="Play music"><span class="vinyl spin"></span><span class="lbl">LOSS RADIO</span><span class="mid"><b>Ending Credits</b><small>Opeth · Loss Radio</small></span><svg class="ico off" viewBox="0 0 12 12"><path d="M3.5 1.5v9L10.5 6z"/></svg><span class="eq on"><i></i><i></i><i></i><i></i></span></button>
    </div></div>
    <figcaption><b>11. جزيرة زي الآيفون</b>
      <span>شريط أسود صغير فوق تحت الهيدر، زي الـ Dynamic Island في الآيفون. أول ما الأغنية تشتغل يتفرد بحركة مرنة ويبين اسمها، وبعد 3 ثواني يرجع صغير وفيه بارات بتتحرك. أي حد عنده آيفون هيفهمه على طول.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o12" data-toggle aria-pressed="false" aria-label="Play music"><span class="scr"><span class="top"><span class="off">Loss Radio</span><span class="on">Now Playing</span><span>▮▮▮</span></span><b>Ending Credits</b>Opeth<span class="prog"><i></i></span></span><span class="wheel"><span class="n">MENU</span><span class="w">◀◀</span><span class="e">▶▶</span><span class="s">▶ ❚❚</span><span class="ctr"></span></span></button>
    </div></div>
    <figcaption><b>12. آيبود قديم</b>
      <span>آيبود صغير بالعجلة بتاعته، وعلى الشاشة اسم الأغنية وخط التقدم بيمشي معاها بجد. فيه حنين للزمن ده، واللي بيشوفه بيبتسم ويدوس عليه.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o13" data-toggle aria-pressed="false" aria-label="Play music"><span class="m">
        <svg viewBox="0 0 52 34"><path class="arc" d="M9.2 18.9A22 22 0 0 1 42.8 18.9"/><path class="red" d="M35.3 13.1A22 22 0 0 1 42.8 18.9"/><path class="tk" d="M11.9 16.1 9.9 13.8M18.5 12.3 17.4 9.5M26 11v-3M33.5 12.3 34.6 9.5M40.1 16.1 42.1 13.8"/><text x="26" y="27" text-anchor="middle">VU</text><line class="needle" x1="26" y1="33" x2="26" y2="10"/></svg>
        <svg viewBox="0 0 52 34"><path class="arc" d="M9.2 18.9A22 22 0 0 1 42.8 18.9"/><path class="red" d="M35.3 13.1A22 22 0 0 1 42.8 18.9"/><path class="tk" d="M11.9 16.1 9.9 13.8M18.5 12.3 17.4 9.5M26 11v-3M33.5 12.3 34.6 9.5M40.1 16.1 42.1 13.8"/><text x="26" y="27" text-anchor="middle">VU</text><line class="needle" x1="26" y1="33" x2="26" y2="10"/></svg>
      </span><span class="foot"><span>LOSS</span><span class="led"></span><span>STEREO</span></span></button>
    </div></div>
    <figcaption><b>13. عدادات الصوت</b>
      <span>عدادين بإبر زي أجهزة الهاي فاي القديمة. وهي واقفة الإضاءة خافتة، ولما تشتغل النور الدافي ينور والإبر ترقص مع الأغنية واللمبة الحمرا تنور. شكل فخم ومختلف عن أي موقع.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o14" data-toggle aria-pressed="false" aria-label="Play music"><span class="win"><span class="row"><span>LOSS FM</span><span class="off">TUNE IN</span><span class="on">98.6 · ON AIR</span></span><span class="row nums"><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></span><span class="ticks"></span><i class="needle"></i></span><span class="knob"></span></button>
    </div></div>
    <figcaption><b>14. راديو Loss FM</b>
      <span>مؤشر راديو قديم. لما تدوس، الزرار يلف والإبرة الحمرا تجري على الموجات وتقف على 98.6، والشاشة تنور وتكتب ON AIR. كده البراند بقى عنده محطة راديو باسمه، وده كلام ينفع يتعمل عليه بوستات كمان.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen" data-shop>
      <button class="o15" data-toggle aria-pressed="false" aria-label="Play music"><svg class="ring" viewBox="0 0 74 74"><defs><path id="ring15" d="M37 37m-28 0a28 28 0 1 1 56 0a28 28 0 1 1-56 0"/></defs><text class="t-off"><textPath href="#ring15" textLength="172">PRESS PLAY • LOSS RADIO • PRESS PLAY • LOSS RADIO •</textPath></text><text class="t-on"><textPath href="#ring15" textLength="172">NOW PLAYING • ENDING CREDITS • NOW PLAYING •</textPath></text></svg><span class="c"><svg class="ico off" viewBox="0 0 12 12"><path d="M3.5 1.5v9L10.5 6z"/></svg><svg class="ico on" viewBox="0 0 12 12"><path d="M3 2h2.2v8H3zM6.8 2H9v8H6.8z"/></svg></span></button>
    </div></div>
    <figcaption><b>15. كلام بيلف</b>
      <span>دايرة بيضا الكلام بيلف حواليها ببطء (PRESS PLAY • LOSS RADIO)، ولما تشتغل الكلام يتغير لاسم الأغنية ويلف أسرع. ده شكل مشهور في مواقع الديزاين والبراندات الشيك.</span></figcaption>
  </figure>
</main>

<script>
  const icons = {
    menu: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>',
    cart: '<svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
    speaker: '<button class="o10" data-toggle aria-pressed="false" aria-label="Play music"><svg viewBox="0 0 24 24"><path d="M4 10v4h3.5l4.5 4V6L7.5 10z"/><path class="w" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>',
  };
  const products = [
    ['006-dark-henley-sweater-long-sleeve', 'Dark Henley Sweater'],
    ['001-long-sleeve-embroidered-tee', 'Long Sleeve Embroidered Tee'],
    ['010-handmade-breakfast-inspired-snugz', 'Breakfast Snugz'],
    ['005-light-henley-sweater-long-sleeve', 'Light Henley Sweater'],
  ];
  const shelf = '<div class="shelf"><h3>New in</h3><div class="grid">' +
    products.map(([dir, name]) => `<div><img src="img/${dir}.jpg" alt="" loading="lazy"><p>${name}</p></div>`).join('') +
    '</div></div>';

  for (const screen of document.querySelectorAll('[data-shop]')) {
    const right = (screen.hasAttribute('data-speaker') ? icons.speaker : '') + icons.cart;
    screen.insertAdjacentHTML('afterbegin',
      `<div class="hdr"><div class="side">${icons.menu}${icons.search}</div><img src="img/logo-loss-navy.png" alt="Loss"><div class="side">${right}</div></div>` + shelf);
  }

  const audio = document.getElementById('song');
  let current = null;

  let islandTimer;

  function setState(phone, on) {
    phone.toggleAttribute('data-on', on);
    const toggle = phone.querySelector('[data-toggle]');
    toggle.setAttribute('aria-pressed', String(on));

    // The island opens big when the song starts, then shrinks back after a few seconds
    if (toggle.classList.contains('o11')) {
      clearTimeout(islandTimer);
      toggle.classList.toggle('big', on);
      if (on) islandTimer = setTimeout(() => toggle.classList.remove('big'), 3000);
    }
  }

  document.addEventListener('click', (event) => {
    const toggle = event.target.closest('[data-toggle]');
    if (!toggle) return;
    const phone = toggle.closest('.phone');

    if (current === phone) {
      setState(phone, false);
      current = null;
      audio.pause();
      return;
    }
    if (current) setState(current, false);
    current = phone;
    setState(phone, true);
    audio.play().catch(() => {});
  });

  audio.addEventListener('timeupdate', () => {
    if (audio.duration) document.documentElement.style.setProperty('--p', (audio.currentTime / audio.duration * 100).toFixed(2) + '%');
  });
</script>
</body>
</html>
