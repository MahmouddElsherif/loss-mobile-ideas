<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loss – شكل صفحة Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Geist:wght@400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b0d47;
    --navy-panel: #0e1053;
    --line: #2e3180;
    --page: #f3f4f8;
    --muted: #5b5e85;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--navy); font-family: Cairo, system-ui, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 40px 16px 72px; }
  .intro h1 { margin: 0 0 8px; font-size: 28px; }
  .intro p { margin: 0; color: var(--muted); font-size: 16px; }

  .option { margin-top: 56px; }
  .option h2 { margin: 0 0 4px; font-size: 22px; }
  .option > p { margin: 0 0 20px; color: var(--muted); font-size: 15px; max-width: 760px; }
  .views { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; direction: ltr; }
  .view-label { direction: rtl; text-align: right; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .frame { overflow: hidden; background: var(--navy); border: 1px solid #c9cfdf; }
  .frame--laptop { border-radius: 10px; }
  .frame--phone { border-radius: 26px; border-width: 6px; border-color: #1a1a2e; }
  .scaler { transform-origin: top left; }
  @media (max-width: 860px) {
    .views { grid-template-columns: minmax(0, 1fr); }
    .view--phone { width: min(320px, 100%); margin-inline: auto; }
  }

  /* ---------- store mockup (always LTR, same tokens as the theme) ---------- */
  .screen {
    container: screen / inline-size;
    direction: ltr; text-align: left;
    background: var(--navy); color: #fff;
    font: 400 16px/1.6 Geist, system-ui, sans-serif;
  }
  .screen a { color: inherit; }
  .bar { background: linear-gradient(90deg, #4a9bf0, #2e3180, #0b0d47); font-size: 11px; letter-spacing: .08em; text-align: center; padding: 7px 8px; white-space: nowrap; overflow: hidden; }
  .head { background: #fff; color: var(--navy); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 16px; font-size: 14px; }
  .head img { height: 34px; display: block; }
  .head .nav { display: none; gap: 22px; }
  .head .burger { width: 20px; height: 12px; border-block: 1.5px solid var(--navy); position: relative; }
  .head .burger::after { content: ""; position: absolute; left: 0; right: 0; top: 3.75px; border-top: 1.5px solid var(--navy); }
  .main { padding: 40px 16px 56px; }
  .t { font: 500 32px/1.2 "Playfair Display", serif; margin: 0 0 20px; }
  .copy p { margin: 0 0 14px; }
  .copy a { text-underline-offset: 3px; }
  .closing { font: 500 21px/1.3 "Playfair Display", serif; margin: 18px 0 0; }
  .socials { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; margin-top: 18px; }
  .socials a { text-underline-offset: 4px; }

  .f { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .f input, .f textarea {
    width: 100%; background: transparent; color: #fff; font: inherit; font-size: 15px;
    border: 1px solid var(--line); border-radius: 4px; padding: 13px 14px; outline: none;
  }
  .f input::placeholder, .f textarea::placeholder { color: #fff; opacity: .65; }
  .f input:focus, .f textarea:focus { border-color: #fff; }
  .f textarea { min-height: 130px; resize: none; display: block; }
  .f button {
    justify-self: start; background: #fff; color: var(--navy); border: 0; border-radius: 3px;
    font: 500 15px Geist, sans-serif; padding: 14px 22px; cursor: pointer;
  }

  /* 1 – centered */
  .o1 { text-align: center; }
  .o1 .copy { margin-bottom: 8px; }
  .o1 .socials { justify-content: center; margin-bottom: 30px; }
  .o1 .closing { margin-top: 16px; }
  .o1 .f { text-align: left; }

  /* 2 – split */
  .o2 .side { margin-bottom: 34px; }

  /* 3 – contact rows */
  .o3 .t { text-align: center; }
  .o3 .copy { text-align: center; }
  .rows { list-style: none; margin: 24px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .rows a, .rows summary {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 16px 2px; text-decoration: none; cursor: pointer; list-style: none;
  }
  .rows summary::-webkit-details-marker { display: none; }
  .rows li { border-bottom: 1px solid var(--line); }
  .rows small { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .65; }
  .rows .v { font-size: 15px; overflow-wrap: anywhere; }
  .rows .arrow { flex: none; transition: transform .2s; }
  .rows a:hover .arrow { transform: translateX(4px); }
  .rows details[open] .arrow { transform: rotate(90deg); }
  .rows details .f { padding: 4px 2px 22px; }
  .o3 .closing { text-align: center; margin-top: 26px; }

  /* 4 – letter */
  .o4 .panel { background: var(--navy-panel); border: 1px solid var(--line); padding: 30px 20px 32px; }
  .o4 .t { text-align: center; }
  .o4 .copy { text-align: center; }
  .o4 .closing { font-style: italic; font-size: 25px; margin: 22px 0 28px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .o4 .f { gap: 6px; }
  .o4 .f input, .o4 .f textarea { border: 0; border-bottom: 1px solid #5a5da8; border-radius: 0; padding: 13px 2px; }
  .o4 .f textarea { min-height: 96px; }
  .o4 .f button { justify-self: center; margin-top: 20px; background: transparent; color: #fff; border: 1px solid #fff; border-radius: 0; padding: 13px 30px; }
  .o4 .f button:hover { background: #fff; color: var(--navy); }

  @container screen (min-width: 750px) {
    .head { padding: 14px 32px; }
    .head .nav { display: flex; }
    .head .burger { display: none; }
    .head img { height: 42px; }
    .main { padding: 56px 40px 88px; }
    .t { font-size: 42px; }
    .f { grid-template-columns: 1fr 1fr; }
    .f .wide, .f button { grid-column: 1 / -1; }

    .o1 { max-width: 680px; margin: 0 auto; }

    .o2 { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.1fr; gap: 96px; align-items: start; }
    .o2 .side { margin: 0; }
    .o2 .closing { font-size: 26px; }

    .o3 { max-width: 620px; margin: 0 auto; }

    .o4 .panel { max-width: 780px; margin: 0 auto; padding: 56px 72px 60px; }
    .o4 .f { column-gap: 28px; }
  }
</style>
</head>

<div class="wrap">
  <header class="intro">
    <h1>شكل صفحة Contact</h1>
    <p>دي 4 أشكال لصفحة Contact، بنفس الكلام وبألوان وخطوط الموقع. كل شكل باين على اللابتوب والموبايل.</p>
  </header>
  <div id="options"></div>
</div>

          <div class="frame frame--laptop" data-w="1280"><div class="scaler">${chrome(o.html)}</div></div></div>
        <div class="view--phone"><div class="view-label">موبايل</div>
          <div class="frame frame--phone" data-w="375"><div class="scaler">${chrome(o.html)}</div></div></div>
      </div>
    </section>`).join('');

  // Each frame renders at the real device width, then scales down to fit.
  document.querySelectorAll('.frame').forEach(frame => {
    const base = +frame.dataset.w;
    const inner = frame.firstElementChild;
    inner.style.width = base + 'px';
    const fit = () => {
      const scale = Math.min(1, frame.clientWidth / base);
      inner.style.transform = `scale(${scale})`;
      frame.style.height = (inner.offsetHeight * scale + (frame.offsetHeight - frame.clientHeight)) + 'px';
    };
    const ro = new ResizeObserver(fit);
    ro.observe(inner);
    ro.observe(frame.parentElement);
    fit();
  });
</script>
</body>
</html>
